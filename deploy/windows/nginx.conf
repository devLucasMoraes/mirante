# Mirante - nginx (Windows)
# Copie este arquivo para o diretorio de instalacao do nginx, sobrescrevendo conf/nginx.conf.
# Ex.: C:\nginx\nginx.exe -p C:\nginx   ->  conf/nginx.conf
# Antes de reiniciar, valide com: nginx -t
#
# Nota: servico em HTTP puro (porta 80) para uso na LAN — evita o aviso de
# certificado nao confiavel nas maquinas clientes (nao ha AD/GPO para distribuir
# a CA do mkcert). Cookies usam COOKIE_SECURE=false (secure: false).

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server_tokens   off;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary       on;

    # HTTP: web estatica (apps/web/dist) + proxy /api para a API (127.0.0.1:3000)
    server {
        listen       80;
        server_name  _;

        root   C:/mirante/apps/web/dist;
        index  index.html;

        # SPA (BrowserRouter): qualquer rota cai no index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Assets com hash no nome -> cache longo imutavel
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API - proxy para o Fastify (mesma origem => cookies first-party, sem CORS cruzado)
        location /api {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}