# Mirante - nginx (Windows)
# Copie este arquivo para o diretorio de instalacao do nginx, sobrescrevendo conf/nginx.conf.
# Ex.: C:\nginx\nginx.exe -p C:\nginx   ->  conf/nginx.conf
# Antes de reiniciar, valide com: nginx -t

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server_tokens   off;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary       on;

    # HTTP -> HTTPS (redireciona preservando o host acessado, ex.: 192.168.1.16)
    server {
        listen       80;
        server_name  _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: web estatica (apps/web/dist) + proxy /api para a API (127.0.0.1:3000)
    server {
        listen       443 ssl;
        server_name  _;

        ssl_certificate      C:/mirante/deploy/windows/certs/mirante.pem;
        ssl_certificate_key  C:/mirante/deploy/windows/certs/mirante-key.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        root   C:/mirante/apps/web/dist;
        index  index.html;

        # SPA (BrowserRouter): qualquer rota cai no index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Assets com hash no nome -> cache longo imutavel
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API - proxy para o Fastify (mesma origem => cookies first-party, sem CORS cruzado)
        location /api {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}