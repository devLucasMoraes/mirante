services:
  mongodb:
    image: mongo:7
    container_name: ${MONGO_CONTAINER_NAME:-mongodb}
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?MONGO_INITDB_DATABASE is required}
      MONGO_INITDB_USERNAME: ${MONGO_INITDB_USERNAME:?MONGO_INITDB_USERNAME is required}
      MONGO_INITDB_PASSWORD: ${MONGO_INITDB_PASSWORD:?MONGO_INITDB_PASSWORD is required}
    volumes:
      - ./docker/mongodb/init-user.js:/docker-entrypoint-initdb.d/init-user.js:ro
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--norc", "-u", "${MONGO_ROOT_USERNAME}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 20s

volumes:
  mongo_data: